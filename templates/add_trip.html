<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Trip</title>
</head>
<body>
    <h1>Add Trip</h1>
    <form method="POST">
        <label for="cost">Cost:</label>
        <input type="number" step="0.01" name="cost" required><br><br>
        <label for="distance">Distance:</label>
        <input type="number" step="0.01" name="distance" required><br><br>
        <label for="travel_time">Travel Time:</label>
        <input type="number" step="0.01" name="travel_time" required><br><br>
        <button type="submit">Add Trip</button>
    </form>
</body>
</html>
