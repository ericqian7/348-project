<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Trip</title>
</head>
<body>
    <h1>Edit Trip</h1>
    <form method="POST">
        <label for="cost">Cost:</label>
        <input type="number" step="0.01" name="cost" value="{{ trip.cost }}" required><br><br>
        <label for="distance">Distance:</label>
        <input type="number" step="0.01" name="distance" value="{{ trip.distance }}" required><br><br>
        <label for="travel_time">Travel Time:</label>
        <input type="number" step="0.01" name="travel_time" value="{{ trip.travel_time }}" required><br><br>
        <button type="submit">Update Trip</button>
    </form>
</body>
</html>
